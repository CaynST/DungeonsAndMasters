server:
  port: 8080

spring:
  application:
    name: dnd-masters
  datasource:
    url: jdbc:sqlite:./data/dnd.db
    driver-class-name: org.sqlite.JDBC
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.community.dialect.SQLiteDialect
        format_sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-please-0123456789}
    expiration-hours: 24
  ai:
    provider: ${AI_PROVIDER:mock}
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:mimo-v2.6-flash}
    base-url: ${AI_BASE_URL:}
    fallback-models: ${AI_FALLBACK_MODELS:longcat-2.5-preview-free,space-bunny-free,muse-spark-1.3-contributor}
    user-agent: ${AI_USER_AGENT:dungeons-and-masters/1.0}
  image:
    provider: ${IMAGE_PROVIDER:placeholder}

logging:
  level:
    org.flywaydb: INFO
    org.hibernate.SQL: WARN
